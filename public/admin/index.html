<!DOCTYPE html>
<html lang="es" class="has-aside-left has-aside-mobile-transition has-navbar-fixed-top has-aside-expanded">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Admin - Evento Deferol</title>

  <!-- Local Vendor CSS -->
  <link rel="stylesheet" href="/vendor/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="/vendor/css/admin-one.min.css">
  <link rel="stylesheet" href="/vendor/css/tabulator_bulma.min.css">

  <style>
    :root {
      --primary-color: #1a1a2e;
      --accent-color: #e94560;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .stat-card .is-widget-label .subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .stat-card .is-widget-label .title {
      font-size: 2.5rem;
    }
    
    .filter-bar {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .status-pendiente { background: #fce4ec; color: #e91e63; }
    .status-validado { background: #e8f5e9; color: #43a047; }
    .status-ingresado { background: #e3f2fd; color: #1976d2; }
    
    .table-container {
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .tabulator {
      font-size: 0.9rem;
    }
    
    /* Responsive collapse styles for mobile */
    .tabulator .tabulator-header .tabulator-col {
      min-width: 100px;
    }
    
    .tabulator .tabulator-responsive-collapse {
      padding: 12px;
      border-top: 1px solid #eee;
      background-color: #fafafa;
      margin-top: 4px;
    }
    
    .tabulator .tabulator-responsive-collapse-title {
      font-weight: 600;
      color: #363636;
      margin-bottom: 4px;
    }
    
    .tabulator .tabulator-responsive-collapse-value {
      color: #4a4a4a;
    }
    
    /* Show as list on narrow screens */
    @media screen and (max-width: 768px) {
      .tabulator {
        font-size: 0.85rem;
      }
      
      /* Make table look more like a list on mobile */
      .tabulator-tableholder {
        overflow-x: hidden;
      }
      
      .tabulator-row {
        display: flex;
        flex-direction: column;
        padding: 8px;
        border-bottom: 1px solid #eee;
      }
      
      .tabulator-row .tabulator-cell {
        padding: 4px 8px;
        border: none;
      }
      
      /* Show action buttons in a row */
      .tabulator-row .tabulator-cell:last-child {
        display: flex;
        gap: 4px;
        justify-content: flex-start;
        margin-top: 8px;
      }
      
      /* Hide column headers on very small screens */
      .tabulator-header {
        display: none;
      }
    }
    
    .modal-content {
      max-width: 90vw;
      width: 90vw;
    }
    
    .modal-card {
      max-width: 700px;
      width: 100%;
    }
    
    .qr-preview {
      width: 100%;
      max-width: 450px;
      margin: 1rem auto;
      display: block;
    }
    
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    
    .loading-overlay.is-hidden {
      display: none;
    }
    
    /* Avatarcircle */
    .is-user-avatar .jb-avatar-span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      background: var(--accent-color);
      color: white;
      border-radius: 50%;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Navbar -->
    <nav id="navbar-main" class="navbar is-fixed-top">
      <div class="navbar-brand">
        <a class="navbar-item is-hidden-desktop jb-aside-mobile-toggle">
          <span class="icon"><i class="mdi mdi-menu"></i></span>
        </a>
      </div>
      <div class="navbar-menu fadeIn animated faster" id="navbar-menu">
        <div class="navbar-end">
          <div class="navbar-item has-dropdown has-dropdown-with-icons has-divider has-user-avatar is-hoverable">
            <a class="navbar-link is-arrowless">
              <div class="is-user-avatar">
                <span class="jb-avatar-span">A</span>
              </div>
              <div class="is-user-name">
                <span>Administrador</span>
              </div>
              <span class="icon"><i class="mdi mdi-chevron-down"></i></span>
            </a>
            <div class="navbar-dropdown">
              <a class="navbar-item" id="btn-logout">
                <span class="icon"><i class="mdi mdi-logout"></i></span>
                <span>Cerrar Sesión</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Sidebar -->
    <aside class="aside is-placed-left is-expanded">
      <div class="aside-tools">
        <div class="aside-tools-label">
          <span><b>Deferol</b> Admin</span>
        </div>
      </div>
      <div class="menu is-menu-main">
        <p class="menu-label">General</p>
        <ul class="menu-list">
          <li>
            <a href="#" class="is-active router-link-active has-icon jb-menu-item" data-section="asistentes">
              <span class="icon"><i class="mdi mdi-account-multiple"></i></span>
              <span class="menu-item-label">Asistentes</span>
            </a>
          </li>
        </ul>
        <p class="menu-label">Sistema</p>
        <ul class="menu-list">
          <li>
            <a href="/" class="has-icon">
              <span class="icon"><i class="mdi mdi-home"></i></span>
              <span class="menu-item-label">Página Principal</span>
            </a>
          </li>
        </ul>
      </div>
    </aside>

    <!-- Title Bar -->
    <section class="section is-title-bar">
      <div class="level">
        <div class="level-left">
          <div class="level-item">
            <ul>
              <li>Admin</li>
              <li>Asistentes</li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <!-- Hero Bar -->
    <section class="hero is-hero-bar">
      <div class="hero-body">
        <div class="level">
          <div class="level-left">
            <div class="level-item">
              <h1 class="title">Lista de Asistentes</h1>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Main Section -->
    <section class="section is-main-section">
      <!-- Loading Overlay -->
      <div class="loading-overlay is-hidden" id="loading">
        <div class="text-center">
          <span class="icon has-text-primary" style="font-size: 3rem;">
            <i class="mdi mdi-spin mdi-loading"></i>
          </span>
          <p class="mt-2">Cargando...</p>
        </div>
      </div>

      <!-- Stats Cards -->
      <div class="stats-grid">
        <div class="card tile is-child">
          <div class="card-content">
            <div class="level is-mobile">
              <div class="level-item">
                <div class="is-widget-label">
                  <p class="subtitle is-spaced">Total Registrados</p>
                  <h1 class="title" id="stat-total">0</h1>
                </div>
              </div>
              <div class="level-item has-widget-icon">
                <span class="icon has-text-primary is-large">
                  <i class="mdi mdi-account-multiple mdi-48px"></i>
                </span>
              </div>
            </div>
          </div>
        </div>
        
        <div class="card tile is-child">
          <div class="card-content">
            <div class="level is-mobile">
              <div class="level-item">
                <div class="is-widget-label">
                  <p class="subtitle is-spaced">Total Ingresados</p>
                  <h1 class="title" id="stat-ingresados">0</h1>
                </div>
              </div>
              <div class="level-item has-widget-icon">
                <span class="icon has-text-info is-large">
                  <i class="mdi mdi-door-open mdi-48px"></i>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <div class="level">
          <div class="level-left">
            <div class="field has-addons">
              <div class="control has-icons-left">
                <input 
                  class="input" 
                  type="search" 
                  id="search-input"
                  placeholder="Buscar por nombre, correo, empresa..."
                >
                <span class="icon is-left">
                  <i class="mdi mdi-magnify"></i>
                </span>
              </div>
              <div class="control">
                <button type="button" class="button is-primary" id="btn-buscar">Buscar</button>
              </div>
            </div>
          </div>
          <div class="level-right">
            <div class="field">
              <div class="select">
                <select id="filter-estado">
                  <option value="">Todos los estados</option>
                  <option value="registrado">Registrado</option>
                  <option value="ingresado">Ingresó</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card has-table has-mobile-sort-spaced">
        <header class="card-header">
          <p class="card-header-title">
            <span class="icon"><i class="mdi mdi-account-multiple"></i></span>
            Registros
          </p>
          <div class="card-header-icon">
            <button type="button" class="button is-small is-primary jb-refresh-icon" title="Actualizar lista">
              <span class="icon"><i class="mdi mdi-refresh"></i></span>
              <span>Actualizar</span>
            </button>
            <button type="button" class="button is-small is-success" id="btn-export-excel" title="Descargar Excel">
              <span class="icon"><i class="mdi mdi-file-excel"></i></span>
              <span>Excel</span>
            </button>
          </div>
        </header>
        <div class="card-content">
          <div class="table-container">
            <div id="asistentes-table"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal">
      <div class="modal-background"></div>
      <div class="modal-card">
        <header class="modal-card-head">
          <p class="modal-card-title">
            <span class="icon"><i class="mdi mdi-account-details"></i></span>
            Detalle del Asistente
          </p>
          <button type="button" class="delete" aria-label="close" id="btn-close-modal"></button>
        </header>
        <section class="modal-card-body">
          <div id="asistente-detail">
            <!-- Content loaded via JS -->
          </div>
        </section>
        <footer class="modal-card-foot">
          <button type="button" class="button" id="btn-cerrar-modal">Cerrar</button>
        </footer>
      </div>
    </div>
  </div>

  <!-- Local Vendor JS -->
  <script src="/vendor/js/admin-one.min.js"></script>
  <script src="/vendor/js/xlsx.full.min.js"></script>
  <script src="/vendor/js/tabulator.min.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
