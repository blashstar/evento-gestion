<!DOCTYPE html>
<!-- saved from url=(0066)https://cdpn.io/pen/debug/dPpmadQ/a04dd4f7852a7c779969fae5b43a935d -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <title>Registro Deferol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css">
  <link rel="stylesheet" href="/estilos/comunes.css">
  <link rel="stylesheet" href="/estilos/registro.css">



<script src="/js/registro.js" defer></script></head>

<body>
  <div id="pagina">
  <main id="principal">
    <hgroup id="titular">
      <img class="logo-deferol" src="/img/deferol.png" alt="deferol">
      <img class="logos-bajos" src="/img/logos_bajos.png" alt="">
    </hgroup>
    <aside id="registro">
      <p>Completa tus datos para registrarte en el evento y para recibir tu entrada QR.</p>
      <form id="datos">
        <div class="campo"><img class="icono" src="/img/usuario.png" alt="Icono usuario">
          <input type="text" name="nombre" placeholder="Nombre completo" required="required">
        </div>
        <div class="campo"><img class="icono" src="/img/telefono.png" alt="Icono teléfono">
          <input type="tel" name="celular" placeholder="Celular" required="required">
        </div>
        <div class="campo"><img class="icono" src="/img/correo.png" alt="Icono correo">
          <input type="email" name="correo" placeholder="Correo electrónico" required="required">
        </div>
        <div class="campo"><img class="icono" src="/img/empresa.png" alt="Icono empresa">
          <input type="text" name="empresa" placeholder="Empresa / Institución" required="required">
        </div>
        <div class="campo"><img class="icono" src="/img/empresa.png" alt="Icono especialidad">
          <input type="text" name="especialidad" placeholder="Especialidad" required="required">
        </div>
        <button type="submit">Registrarme</button>
      </form>
      <div class="nota">*Se enviará un código QR para que puedas ingresar al evento.</div>
    </aside>
  </main>
</div>




</body></html>
