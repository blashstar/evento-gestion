<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Evento Deferol</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/estilos/comunes.css">
    <link rel="stylesheet" href="/estilos/registro.css">
</head>
<body>
    <div id="pagina">
        <header id="encabezado">
            <figure class="logo-deferol">
                <img src="/img/deferol.png" alt="Logo Deferol">
            </figure>
            <figure class="logos-bajos">
                <img src="/img/logos_bajos.png" alt="Logos colaboradores">
            </figure>
        </header>

        <aside id="registro">
            <h2>Registro</h2>
            <p>Ingrese sus datos para confirmar su inscripción</p>

            <form id="datos" class="formulario">
                <div class="campo">
                    <label for="nombre">Nombres y Apellidos</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Nombres y Apellidos"
                        autocomplete="name"
                        required
                    >
                    <span class="mensaje error-message"></span>
                </div>

                <div class="campo">
                    <label for="celular">Celular</label>
                    <input
                        type="tel"
                        id="celular"
                        name="celular"
                        placeholder="Celular"
                        autocomplete="tel"
                        required
                    >
                    <span class="mensaje error-message"></span>
                </div>

                <div class="campo">
                    <label for="empresa">Empresa / Institución</label>
                    <input
                        type="text"
                        id="empresa"
                        name="empresa"
                        placeholder="Empresa / Institución"
                        autocomplete="organization"
                        required
                    >
                    <span class="mensaje error-message"></span>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Correo electrónico"
                        autocomplete="email"
                        required
                    >
                    <span class="mensaje error-message"></span>
                </div>

                <div class="campo">
                    <label for="especialidad">Especialidad</label>
                    <input
                        type="text"
                        id="especialidad"
                        name="especialidad"
                        placeholder="Especialidad"
                        required
                    >
                    <span class="mensaje error-message"></span>
                </div>

                <div class="campo campo-checkbox">
                    <label class="checkbox-label">
                        <input type="checkbox" name="acepta_terminos" id="acepta_terminos">
                        <span class="checkmark"></span>
                        <span class="checkbox-text">
                            Al registrarte aceptas nuestros
                            <a href="/terminos" target="_blank">Términos de Servicio</a>
                        </span>
                    </label>
                    <span class="mensaje error-message"></span>
                </div>

                <div class="botones">
                    <button type="submit" class="boton">
                        <span class="button-text">ENVIAR</span>
                        <span class="button-loading" style="display: none;">
                            <svg class="spinner" viewBox="0 0 53 53" style="width: 20px; height: 20px;" role="img" aria-label="Cargando">
                                <title>Cargando...</title>
                                <circle cx="26.5" cy="26.5" r="22" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="140 140" style="animation: spin 1s linear infinite; transform-origin: center;"></circle>
                            </svg>
                        </span>
                    </button>
                </div>
            </form>
        </aside>
    </div>

    <script src="/js/registro.js" defer></script>
</body>
</html>
